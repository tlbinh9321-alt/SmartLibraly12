<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Library · Resource Management System</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6bff'/%3E%3Cpath d='M9 9h10a4 4 0 0 1 4 4v10H13a4 4 0 0 1-4-4z' fill='none' stroke='white' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/dashboard">
        <span class="brand-mark"><svg viewBox="0 0 32 32" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M8 7h11a5 5 0 0 1 5 5v13H13a5 5 0 0 1-5-5z"/><path d="M13 13h6M13 17.5h4"/></svg></span>
        <span class="brand-text"><strong>SMART LIBRARY</strong><small>Resource Management System</small></span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div class="status-pill" id="backendStatus"><span class="dot"></span><span class="status-text">Connecting…</span></div>
        <div class="foot-note">C++17 backend · REST API</div>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu"></button>
        <div class="topbar-title">
          <div class="crumb" id="crumb">Smart Library</div>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <div class="topbar-actions">
          <span class="badge demo-badge" id="demoBadge" hidden>DEMO DATA</span>
          <button class="btn btn-ghost btn-sm" id="topSave" title="Write the current state to the data files"></button>
        </div>
      </header>
      <div class="banner" id="demoBanner" hidden></div>
      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="modal-root" id="modalRoot"></div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/resources.js"></script>
  <script src="js/members.js"></script>
  <script src="js/loans.js"></script>
  <script src="js/reservations.js"></script>
  <script src="js/search.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/settings.js"></script>
  <script>document.addEventListener('DOMContentLoaded', function () { App.boot(); });</script>
</body>
</html>
